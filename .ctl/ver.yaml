# A bump leaves every Cargo.lock that records nishiki stale.
# ci.yml runs `cargo package --locked`, and the codegen and bench tasks pass
# --locked to their own workspaces.
prepare:
  after: [mise, run, "release:locks"]
  stage:
    - Cargo.lock
    - codegen/Cargo.lock
    - bench/Cargo.lock
    - bench/compare/Cargo.lock

packages:
  - name: nishiki
    path: Cargo.toml

# Maintainers and Apps a changelog never credits.
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
