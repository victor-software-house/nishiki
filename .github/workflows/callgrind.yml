name: Callgrind

# On a pull request labelled `bench`: instruction counts of every oracle
# fixture of every language, at the base and the head (mise run callgrind).
# Three passes each get a table in the job summary: lexing, the first
# document and colouring. The gate builds both sides with one codegen unit,
# so the counts move only with the code, not with how it falls across units.
# It fails when any pass of a language rises more than 0.5%.
# Columns at the default sixteen units, what users build, are for
# information only. valgrind comes from the bench mise profile
# (mise.bench.toml, conda-forge), which only this job loads, with
# MISE_ENV=ci,bench. It lives apart from ci.yml, which the template renders.

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: >-
    callgrind-${{ github.event.pull_request.number || github.ref_name }}${{
    github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

env:
  MISE_ENV: ci,bench

jobs:
  callgrind:
    name: Callgrind
    if: >-
      ${{ !github.event.pull_request.draft
      && contains(github.event.pull_request.labels.*.name, 'bench') }}
    # The build runner's cache volume, read only. This job never commits it.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-tag-rust-nishiki
      - nscloud-cache-size-50gb
      - nscloud-cache-exp-do-not-commit
    timeout-minutes: 30
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the base commit is local: with no
          # credentials kept, a later fetch of this private repository fails.
          fetch-depth: 0
      - name: Mount the cache volume
        continue-on-error: true
        timeout-minutes: 3
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
            ~/.cargo
            ${{ github.workspace }}/target
      - name: Install locked toolchain
        timeout-minutes: 5
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.6
          cache: false
      - name: Compare with the base
        timeout-minutes: 20
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mise run callgrind "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    name: Bench
    # verify does not build the bench workspace, bench/.
    # This job keeps it building, linted and runnable.
    # Each benchmark runs once, untimed.
    # The comparison workspace, bench/compare/, is formatted and linted only.
    # Wall time never gates (bench/AGENTS.md).
    if: >-
      ${{ !github.event.pull_request.draft
      && contains(github.event.pull_request.labels.*.name, 'bench') }}
    # The build runner's cache volume, read only: this job never commits it.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-tag-rust-nishiki
      - nscloud-cache-size-50gb
      - nscloud-cache-exp-do-not-commit
    timeout-minutes: 20
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount the cache volume
        continue-on-error: true
        timeout-minutes: 3
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
            ~/.cargo
            ${{ github.workspace }}/target
      - name: Install locked toolchain
        timeout-minutes: 5
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.6
          cache: false
      - name: Check the bench workspace
        timeout-minutes: 12
        run: mise run bench:check
