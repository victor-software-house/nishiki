name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

# The shared Verify job reads this run and the runs that replaced it.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    # The shared jobs that install tools trade the job's OIDC token for a
    # release mirror session token.
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@d6ce82bb1fe3a3bac6c68619c603993c08990d64 # main, 2026-11-09
    with:
      mise-version: 2026.10.25
      advisories: true
      semver: true
      timeout-minutes: 8
      build-runner: '["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-cache-tag-rust-nishiki", "nscloud-cache-size-50gb"]'
      read-only-runner: '["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-cache-tag-rust-nishiki", "nscloud-cache-size-50gb", "nscloud-cache-exp-do-not-commit"]'
      light-runner: nscloud-ubuntu-24.04-amd64-2x4
      cache-volume: true
      cache-size: 50
      cache-size-label: nscloud-cache-size-50gb
      read-only-label: nscloud-cache-exp-do-not-commit
