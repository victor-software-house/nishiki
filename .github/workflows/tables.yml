name: Generated tables

# Regenerates each table that a script writes from Shiki.
# A check fails when the committed table differs.
# - src/textmate/regex/folds.rs: oracle/case-folds.ts measures it on
#   Oniguruma (`mise run check:case-folds`).
# - src/css/words.rs: oracle/css-words.ts reads it from the css grammar
#   (`mise run check:css-words`).
# - Each rule-engine language's tables: its oracle/<language>-grammar.ts
#   writes them and formats them with rustfmt
#   (`mise run check:rule-grammars`).
# Bun fetches Shiki from npm.
# The checks therefore sit outside the offline verify in ci.yml.
# The template renders ci.yml.
# This workflow runs only on a pull request that touches a table or its
# script.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - oracle/case-folds.ts
      - src/textmate/regex/folds.rs
      - mise-tasks/check/case-folds.sh
      - oracle/alternation.ts
      - oracle/css-words.ts
      - src/css/words.rs
      - mise-tasks/check/css-words.sh
      - oracle/*-grammar.ts
      - src/*/grammar.rs
      - src/*/scope.rs
      - src/cpp/types.rs
      - src/swift/dispatch.rs
      - mise-tasks/check/rule-grammars.sh

permissions:
  contents: read

concurrency:
  group: tables-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  # Only what each check needs is installed.
  # That is bun, and the formatting nightly for the Swift tables.
  # The build toolchain stays out.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  case-folds:
    name: Case folds
    if: ${{ !github.event.pull_request.draft }}
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 8
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        timeout-minutes: 3
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install bun
        timeout-minutes: 3
        run: mise install --locked bun@1.4.4
      - name: Compare the fold table with what its script measures
        timeout-minutes: 3
        run: mise run check:case-folds

  css-words:
    name: CSS words
    if: ${{ !github.event.pull_request.draft }}
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 8
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        timeout-minutes: 3
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install bun
        timeout-minutes: 3
        run: mise install --locked bun@1.4.4
      - name: Compare the CSS word table with what its script writes
        timeout-minutes: 3
        run: mise run check:css-words

  rule-grammars:
    name: Rule-engine grammar tables
    if: ${{ !github.event.pull_request.draft }}
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 20
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        timeout-minutes: 3
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install bun and the formatting nightly
        timeout-minutes: 5
        run: mise install --locked bun@1.4.4 rust@nightly-2026-11-01
      - name: Compare each rule-engine table with what its script writes
        timeout-minutes: 12
        run: mise run check:rule-grammars
