name: Shiki fidelity

# Runs every grammar Shiki 4.6.0 bundles on its input (mise run
# check:fidelity): Shiki's sample, or a stand-in for the four languages Shiki
# has no sample for. It fails when any non-whitespace byte gets other scopes
# than Shiki gives it. The grammars come from Shiki's npm packages, which
# the root bun.lock pins. The inputs come from one pinned commit of the public
# nishiki-sources mirror (oracle/AGENTS.md rule 9). Nothing from either is
# committed here. The job summary holds a row per language, with its first
# differing byte.
# It is a required check, so it runs on every pull request and in the merge
# queue: a path filter would leave it pending on the pull requests it skips.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: fidelity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  # The nishiki-sources commit the oracle reads. A pull request that adds an
  # input fills the mirror first, then raises this commit.
  NISHIKI_SOURCES_COMMIT: e16b69b0ef25ea649db5a0dda35ebdb4cdc55982
  NISHIKI_SOURCES: ${{ github.workspace }}/target/sources

jobs:
  fidelity:
    name: Shiki fidelity
    if: ${{ !github.event.pull_request.draft }}
    # The build runner's cache volume, read only. This job never commits it.
    runs-on: ["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-cache-tag-rust-nishiki", "nscloud-cache-size-50gb", "nscloud-cache-exp-do-not-commit"]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount the cache volume
        continue-on-error: true
        timeout-minutes: 3
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
            ~/.cargo
            ${{ github.workspace }}/target
      - name: Install locked toolchain
        timeout-minutes: 5
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          cache: false
      - name: Install bun
        timeout-minutes: 3
        run: mise install --locked bun@1.4.4
      - name: Check out the pinned sources mirror
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victor-software-house/nishiki-sources
          ref: ${{ env.NISHIKI_SOURCES_COMMIT }}
          path: target/sources
          persist-credentials: false
      - name: Compare every Shiki grammar's input with Shiki
        timeout-minutes: 12
        run: mise run check:fidelity
      - name: Add the report to the job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: |
          if [ -f target/fidelity/report.md ]; then
            cat target/fidelity/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
