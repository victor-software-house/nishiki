name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It plans every version commit not yet fully released and publishes each at
# that commit, whatever main's HEAD is now, then opens or updates the Version
# PR on verctl/release/main. The operator merges the Version PR; merging it
# publishes to crates.io.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      id-token: write # crates.io trusted publishing
    uses: victor-software-house/verctl/.github/workflows/release.yml@f5937655e6c5531255cf59b5ab9732572897db44 # v0.7.1
    with:
      mise-version: 2026.10.25
      mise-env: ci,release
      # A private repository: the plan, publish, docs and propose jobs run on
      # Namespace, as its CI does.
      runner: '["nscloud-ubuntu-24.04-amd64-4x8"]'
      # Publishing waits for the operator (2026-11-02): the Version PR stays
      # open until the operator merges it.
      auto-merge: false
      crates-io-trusted-publishing: true
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
