# jactionlint reads this file under actionlint's name. Without a profile it
# applies its default profile and prints a note on every run.
profile: default
self-hosted-runner:
  labels:
    - "nscloud-ubuntu-24.04-amd64-2x4"
    - "nscloud-ubuntu-24.04-amd64-4x8-with-cache"
    - "nscloud-cache-tag-rust-nishiki"
    - "nscloud-cache-size-50gb"
    - "nscloud-cache-exp-do-not-commit"
