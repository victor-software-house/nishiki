# Markdown lint, checked by `mise run lint:md`.
[global]
# A release tool writes CHANGELOG.md; nobody edits it by hand.
# The oracle's Markdown inputs are test data, written to exercise the grammar.
exclude = ["target/**", "CHANGELOG.md", "oracle/inputs/*.md"]
# Prose uses semantic line breaks, so line length is not linted.
disable = ["MD013"]

[per-file-ignores]
# A one-line import of AGENTS.md.
"CLAUDE.md" = ["MD041"]
# A changeset is one release-note paragraph under YAML frontmatter, in the
# Bun kinds (Changesets) and the Rust kinds (verctl reads the same format).
".changeset/*.md" = ["MD041"]
# OpenSpec delta specs start with their operation heading, not a title.
"openspec/changes/*/specs/**/spec.md" = ["MD041"]
