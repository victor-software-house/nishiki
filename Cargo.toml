# Shared code that only some languages use; not for callers.
# The code every lexer shares, on with any language and with the TextMate
# engine, which runs grammars through it.
# A build with neither leaves it unused.
_language = []
# The classes read characters through the UTF-8 helpers.
_classes = ["_utf8"]
# The rule engine's hand-over to a language a rule embeds, for Ruby's here
# documents, Lua's `ffi.cdef`, GraphQL's interpolations, Svelte's
# expressions and blocks, and Astro's expressions and bodies.
_embedding = ["_rule-engine"]
# The hand-over of a grammar that embeds a language and is itself embedded,
# for GraphQL in Vue, CoffeeScript in Vue and HAML, PHP, and Elixir and LaTeX
# in Markdown, and HAML in Ruby.
_halting-embedding = ["_embedding"]
# The event handler and character entity names of the `html` grammar, which
# other grammars spell the same way.
_html-words = []
# The Unicode classes that identifiers read beside the letters and digits:
# `\p{Nl}`, `[\p{Mn}\p{Mc}]` and `\p{Pc}`.
_identifier-classes = ["_classes"]
# The matchers and word tables that PHP's and Hack's grammars share.
_php-family = ["_rule-tables"]
_scope-table = []
# tag::frame_kinds!, for the lexers that declare their frame kinds with it.
_frame-kinds = []
_rule-engine = ["_classes"]
# The engine's candidate tables and shared character classes, for a language
# whose matchers come from a grammar's generated tables; Makefiles use neither.
_rule-tables = ["_rule-engine"]
_space = []
# nishiki's own TextMate engine, which runs bundled grammars.
_textmate = ["dep:regex-automata", "dep:regex-syntax", "_utf8", "_language"]
_utf8 = []

# Theme::from_json, for theme files in Shiki's JSON format. Not the JSON
# language, which is `lang-json`.
json = ["dep:serde_json"]

[dependencies]
memchr = "2.8.3"
regex-automata = { version = "0.4.18", optional = true, default-features = false, features = [
  "std",
  "syntax",
  "meta",
  "nfa-pikevm",
  "nfa-backtrack",
  "hybrid",
  "dfa-onepass",
  "perf-literal",
] }
regex-syntax = { version = "0.8.11", optional = true, default-features = false }
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
indoc = { workspace = true }
nishiki-alloc-count = { workspace = true }

# The workspace's lints, which the test and example members share.
# nishiki-alloc-count keeps its own, for its one unsafe implementation.
[lints]
workspace = true

# The library, the integration test, the examples,
# and the test-support crate that holds the one unsafe implementation the
# tests need (CODING_STANDARDS 3.3). The benchmarks keep a workspace of their
# own (CODING_STANDARDS 5.3).
[workspace]
members = ["examples", "nishiki-alloc-count", "tests"]
exclude = ["bench"]
resolver = "3"

# The development dependencies that nishiki and its test members share.
[workspace.dependencies]
indoc = "2.0.8"
# nishiki itself, for the test and example members, declared once
# (Kody, #609). Both entries are paths only, so cargo drops them from the
# published manifest.
nishiki = { path = "." }
nishiki-alloc-count = { path = "nishiki-alloc-count" }

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# nishiki keeps Cargo's default release profile, unlike the template's
# size-tuned one.
# Cargo ignores the profiles of a dependency, so consumers build nishiki at
# opt-level 3 with sixteen codegen units.
# The release examples that `mise run callgrind` counts must measure that
# build, the layout users get.
