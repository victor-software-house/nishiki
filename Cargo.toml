docs = ["config", "lang-latex", "lang-markdown", "lang-tex"]
# nishiki's TextMate engine, and the grammars a caller loads into it.
# `json` reads them in Shiki's JSON form. No bundled language runs on it now.
textmate = ["_textmate", "json"]
# A grammar as Rust, for a build script: `ToTokens` for `Grammar` with
# `codegen`, and `Grammar::to_rust` with `format`. A caller turns them on for
# its build-dependency only, so the program's own build gains nothing.
codegen = ["textmate", "dep:proc-macro2", "dep:quote"]
format = ["codegen", "dep:prettyplease", "dep:syn"]

