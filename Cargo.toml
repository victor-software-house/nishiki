[package]
name = "nishiki"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "A syntax highlighting engine, written from scratch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
readme = "README.md"
keywords = ["syntax", "highlighting", "lexer", "textmate"]
categories = ["text-processing", "parser-implementations"]
# The published source holds only what builds and documents the crate.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[dependencies]
memchr = "2.8.3"

[dev-dependencies]
indoc = "2.0.8"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"
