[package]
name = "nishiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A syntax highlighting engine, written from scratch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
readme = "README.md"
keywords = ["syntax", "highlighting", "lexer", "textmate"]
categories = ["text-processing", "parser-implementations"]
# One integration test binary, tests/it/main.rs, rather than one per file.
autotests = false
# The published source holds only what builds and documents the crate.
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "THIRD-PARTY-NOTICES.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[features]
# Every language with a lexer of its own is on by default; `default-features =
# false` and one or more `lang-*` features, or a tier, build only what a caller
# highlights.
default = ["all"]
all = [
  "lang-c",
  "lang-cpp",
  "lang-csharp",
  "lang-css",
  "lang-diff",
  "lang-dockerfile",
  "lang-erb",
  "lang-go",
  "lang-graphql",
  "lang-html",
  "lang-html-derivative",
  "lang-ini",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-jsx",
  "lang-kotlin",
  "lang-less",
  "lang-lua",
  "lang-make",
  "lang-markdown",
  "lang-python",
  "lang-ruby",
  "lang-rust",
  "lang-scss",
  "lang-shell",
  "lang-sql",
  "lang-swift",
  "lang-toml",
  "lang-tsx",
  "lang-typescript",
  "lang-xml",
  "lang-yaml",
]

# Tiers, which overlap.
config = [
  "lang-diff",
  "lang-dockerfile",
  "lang-ini",
  "lang-json",
  "lang-make",
  "lang-toml",
  "lang-xml",
  "lang-yaml",
]
web = [
  "lang-css",
  "lang-erb",
  "lang-graphql",
  "lang-html",
  "lang-html-derivative",
  "lang-javascript",
  "lang-json",
  "lang-jsx",
  "lang-less",
  "lang-scss",
  "lang-tsx",
  "lang-typescript",
]
systems = [
  "lang-c",
  "lang-cpp",
  "lang-go",
  "lang-java",
  "lang-kotlin",
  "lang-rust",
  "lang-shell",
  "lang-swift",
]
docs = ["config", "lang-markdown"]
textmate = [
  "lang-bat",
  "lang-cmake",
  "lang-dart",
  "lang-haskell",
  "lang-julia",
  "lang-mermaid",
  "lang-nix",
  "lang-powershell",
  "lang-proto",
  "lang-scala",
  "lang-zig",
]

# One feature per lexer module. A language that embeds another needs it.
lang-bat = ["_textmate"]
lang-c = ["_scope-table", "_rule-engine", "_classes", "_utf8"]
lang-cmake = ["_textmate"]
lang-cpp = ["_scope-table", "_rule-tables", "_classes"]
lang-csharp = ["_scope-table", "_rule-tables", "_classes"]
lang-css = ["_scope-table", "_rule-tables", "_classes"]
lang-dart = ["_textmate"]
lang-diff = ["_scope-table", "_classes", "_utf8"]
lang-dockerfile = ["_scope-table", "_classes", "_utf8", "_frame-kinds"]
lang-erb = ["lang-html", "lang-ruby"]
lang-go = ["_scope-table", "_rule-tables", "_classes"]
lang-graphql = [
  "_scope-table",
  "lang-javascript",
  "_classes",
  "_utf8",
  "_frame-kinds",
]
lang-haskell = ["_textmate"]
lang-html = ["_scope-table", "lang-css", "lang-javascript", "_classes"]
lang-html-derivative = ["lang-html"]
lang-ini = ["_scope-table", "_classes", "_utf8", "_frame-kinds"]
lang-java = ["_scope-table", "_rule-tables", "_classes"]
# The typescript module lexes four dialects, lang-javascript, lang-jsx,
# lang-tsx and lang-typescript, each a copy of the lexer.
lang-javascript = ["_classes", "_space"]
lang-json = ["_classes", "_utf8", "_frame-kinds"]
lang-jsx = ["_classes", "_space"]
lang-julia = ["_textmate"]
lang-kotlin = ["_scope-table", "_rule-tables", "_classes"]
lang-less = ["_scope-table", "_rule-tables", "_classes"]
lang-lua = ["_scope-table", "_rule-tables", "_classes"]
lang-make = [
  "_scope-table",
  "_rule-engine",
  "_classes",
  "_utf8",
  "_frame-kinds",
]
lang-markdown = ["_scope-table", "_classes", "_utf8"]
lang-mermaid = ["_textmate"]
lang-nix = ["_textmate"]
lang-powershell = ["_textmate"]
lang-proto = ["_textmate"]
lang-python = ["_scope-table", "_rule-tables"]
lang-ruby = ["_scope-table", "_rule-tables", "_classes"]
lang-rust = ["_scope-table", "_classes", "_space", "_utf8"]
lang-scala = ["_textmate"]
lang-scss = ["lang-css"]
lang-shell = ["_scope-table", "_classes", "_utf8", "_frame-kinds"]
lang-sql = ["_scope-table", "_rule-engine", "_classes", "_utf8", "_frame-kinds"]
lang-swift = ["_scope-table", "_rule-tables", "_classes"]
lang-toml = ["_scope-table", "_classes", "_utf8", "_frame-kinds"]
lang-tsx = ["_classes", "_space"]
lang-typescript = ["_classes", "_space"]
lang-xml = ["_scope-table", "lang-java", "_classes", "_utf8"]
lang-yaml = ["_scope-table", "_utf8", "_space", "_frame-kinds"]
lang-zig = ["_textmate"]

# Shared code that only some languages use; not for callers.
# The classes read characters through the UTF-8 helpers.
_classes = ["_utf8"]
_scope-table = []
# tag::frame_kinds!, for the lexers that declare their frame kinds with it.
_frame-kinds = []
_rule-engine = ["_classes"]
# The engine's candidate tables and shared character classes, for a language
# whose matchers come from a grammar's generated tables; Makefiles use neither.
_rule-tables = ["_rule-engine"]
_space = []
# nishiki's own TextMate engine, which runs bundled grammars.
_textmate = ["dep:regex-automata"]
_utf8 = []

# Theme::from_json, for theme files in Shiki's JSON format. Not the JSON
# language, which is `lang-json`.
json = ["dep:serde_json"]

[dependencies]
memchr = "2.8.3"
regex-automata = { version = "0.4.18", optional = true, default-features = false, features = [
  "std",
  "syntax",
  "meta",
  "nfa-pikevm",
  "nfa-backtrack",
  "hybrid",
  "dfa-onepass",
  "perf-literal",
] }
serde_json = { version = "1.0.154", optional = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
# The tests name languages across the whole list, so they need all of it.
required-features = ["all"]

[dev-dependencies]
indoc = "2.0.8"
# Path only, so cargo drops it from the published manifest.
nishiki-alloc-count = { path = "nishiki-alloc-count" }

# The library and the test-support crate that holds the one unsafe
# implementation the tests need (CODING_STANDARDS 3.3). The benchmarks keep
# a workspace of their own (CODING_STANDARDS 5.3).
[workspace]
members = ["nishiki-alloc-count"]
exclude = ["bench"]
resolver = "3"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it, not a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# format! or push_str, not + on a String.
string_add = "deny"
# From and TryFrom, not as, which can silently truncate or wrap. A site that
# truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]>, not Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls the first the
# idiomatic path and mod.rs the older style, whose many same-named files blur
# together in an editor (ch07-05, "Alternate File Paths").
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"
