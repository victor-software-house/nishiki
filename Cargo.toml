[package]
name = "nishiki"
version = "0.1.1"
edition = "2024"
rust-version = "1.100.0"
description = "A syntax highlighting engine, written from scratch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
keywords = ["syntax", "highlighting", "lexer", "textmate"]
categories = ["text-processing", "parser-implementations"]
# The integration test and the examples build in tests/ and examples/,
# members that are never published, so the published package declares no
# target it leaves out.
autotests = false
autoexamples = false
# The published source holds only what builds and documents the crate.
# A name without a slash would match at any depth, as in .gitignore, so each
# root file starts with one.
include = [
  "src/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/THIRD-PARTY-NOTICES.md",
]

[package.metadata.docs.rs]
all-features = true
# docs.rs builds the unstable module too, so its page shows the rule engine's
# API; it sets `--cfg docsrs` itself.
rustc-args = ["--cfg", "nishiki_unstable"]
rustdoc-args = ["--cap-lints", "warn", "--cfg", "nishiki_unstable"]

[features]
# Every language with a lexer of its own is on by default; `default-features =
# false` and one or more `lang-*` features, or a tier, build only what a caller
# highlights.
default = ["all"]
all = [
  "lang-asm",
  "lang-astro",
  "lang-bat",
  "lang-blade",
  "lang-c",
  "lang-cmake",
