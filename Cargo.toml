# Shared code that only some languages use; not for callers.
# The code every lexer shares, on with any language and with the TextMate
# engine, which runs grammars through it.
# A build with neither leaves it unused.
_language = []
# The hand-written lexers, which every language turns on.
# The TextMate engine alone leaves the code only they use unused.
_hand-lexers = ["_language"]
# The classes read characters through the UTF-8 helpers.
_classes = ["_utf8"]
# The widths of the `\s` and `\w` characters at a byte, and `\w` before one,
# for the lexers that read the classes byte by byte.
_class-widths = ["_classes"]
# The rule engine's hand-over to a language a rule embeds, for Ruby's here
# documents, Lua's `ffi.cdef`, GraphQL's interpolations, Svelte's
# expressions and blocks, and Astro's expressions and bodies.
_embedding = ["_rule-engine", "_start-embedded", "_context-first-token"]
# `Language::start_embedded`, which starts a language that another embeds by
# its `Language`: in Markdown's fences, the rule engine's hand-over and the
# TextMate engine's.
_start-embedded = ["_context-scratch"]
# The lexers' reusable buffers in a line's context, for the lexers that keep
# some there.
_context-scratch = []
# Where a line's tokens start in a context, for the lexers that cut tokens
# back to a place: the rule engine's hand-over, HTML and the TextMate engine.
_context-first-token = []
# `Stopped::halt`, for the hand-written lexers that stop where a halt of the
# language embedding them holds.
_stopped-halt = []
# The test helpers that lex a text into rows of each token's text and
# scopes. Only the tests read them.
_test-rows = []
# The test helpers that read one token's scopes from lexed rows.
_test-scopes = ["_test-rows"]
# The test helpers that cut lexed rows to each token's innermost scope and
# read one token's.
_test-leaves = ["_test-rows"]
# The hand-over of a grammar that embeds a language and is itself embedded,
# for GraphQL in Vue, CoffeeScript in Vue and HAML, PHP, and Elixir and LaTeX
# in Markdown, and HAML in Ruby.
_halting-embedding = ["_embedding"]
# The event handler and character entity names of the `html` grammar, which
# other grammars spell the same way.
_html-words = []
# The Unicode classes that identifiers read beside the letters and digits:
# `\p{Nl}`, `[\p{Mn}\p{Mc}]` and `\p{Pc}`.
_identifier-classes = ["_classes"]
# The matchers and word tables that PHP's and Hack's grammars share.
_php-family = ["_rule-tables"]
_scope-table = []
# tag::frame_rules!, for the lexers that declare their frame rules with it.
_frame-rules = []
_rule-engine = ["_classes", "_context-scratch"]
# The scan's step to the last blank of a run (`BlankRuns::ToLast`), for a
# grammar with a pattern that takes one blank and then a character that is not
# one.
_blank-runs-to-last = ["_rule-tables"]
# Scope names that repeat the text of a capture group, as `storage.type.$1.cpp`
# does (`ScopeName::Capture`).
_capture-names = ["_rule-engine"]
# The engine's candidate tables and shared character classes, for a language
# whose matchers come from a grammar's generated tables; Makefiles use neither.
_rule-tables = ["_rule-engine"]
_space = []
# nishiki's own TextMate engine, which runs bundled grammars.
_textmate = [
  "dep:regex-automata",
  "dep:regex-syntax",
  "_utf8",
  "_language",
  "_start-embedded",
  "_stopped-halt",
  "_context-first-token",
]
_utf8 = []

# Theme::from_json, for theme files in Shiki's JSON format, and with the
# TextMate engine its grammar compiler. Not the JSON language, which is
# `lang-json`.
json = ["dep:serde", "dep:serde_json"]

[dependencies]
memchr = "2.8.3"
regex-automata = { version = "0.4.18", optional = true, default-features = false, features = [
  "std",
  "syntax",
  "meta",
  "nfa-pikevm",
  "nfa-backtrack",
  "hybrid",
  "dfa-onepass",
  "perf-literal",
] }
regex-syntax = { version = "0.8.11", optional = true, default-features = false }
# The grammar compiler reads JSON through a serde visitor of its own.
# serde_json's `Value` sorts object keys, and a grammar's injections keep the
# order of its keys. serde_json already depends on serde, so the build gains no
# crate.
serde = { version = "1.0.229", optional = true, default-features = false, features = [
  "std",
] }
serde_json = { version = "1.0.154", optional = true }
# `codegen` writes a grammar as tokens; `format` lays them out as a file.
# Each takes only the features it uses (CODING_STANDARDS 3.5).
proc-macro2 = { version = "1.0.107", optional = true, default-features = false }
quote = { version = "1.0.47", optional = true, default-features = false }
prettyplease = { version = "0.3.0", optional = true, default-features = false }
syn = { version = "3.0.10", optional = true, default-features = false, features = [
  "full",
  "parsing",
] }

[dev-dependencies]
indoc = { workspace = true }
nishiki-alloc-count = { workspace = true }

# The workspace's lints, which the test and example members share.
# nishiki-alloc-count keeps its own, for its one unsafe implementation.
[lints]
workspace = true

# The library, the integration test, the examples,
# and the test-support crate that holds the one unsafe implementation the
# tests need (CODING_STANDARDS 3.3). The benchmarks keep a workspace of their
# own (CODING_STANDARDS 5.3).
[workspace]
members = ["examples", "examples/build-script", "nishiki-alloc-count", "tests"]
exclude = ["bench", "codegen"]
resolver = "3"

# The development dependencies that nishiki and its test members share.
[workspace.dependencies]
indoc = "2.0.8"
# nishiki itself, for the test and example members, declared once
# (Kody, nishiki-archive#609). Both entries are paths only, so cargo drops
# them from the published manifest.
# Each member asks for nishiki's default features itself.
# `check:size` can then build the examples with one tier alone.
nishiki = { path = ".", default-features = false }
nishiki-alloc-count = { path = "nishiki-alloc-count" }

# The budgets `mise run check:size` holds the `size` example to, per tier.
# `text` is `.text`; `data` is `.rodata`, `.data.rel.ro` and `.data`, where
# the lexers' tables sit.
# Each budget is what CI measured on linux-x64 at the commit that set it.
# A budget is lowered, never raised without a measured reason.
[workspace.metadata.size]
tolerance-percent = 2

[workspace.metadata.size.tiers]
# One small language: the shared engine with the least on top.
json = { features = "nishiki/lang-json", text = 334243, data = 52060 }
# Every language of the default tier.
all = { features = "nishiki/all", text = 7375139, data = 2328348 }

# The build-script example's programs, whose nishiki has the default
# languages and `textmate` but neither `codegen` nor `format`.
# This one loads the grammar's bytes.
[workspace.metadata.size.tiers.build-script-bytes]
package = "nishiki-build-script"
bin = "nishiki-build-script"
text = 8186659
data = 2549244

# This one includes the grammar as Rust.
[workspace.metadata.size.tiers.build-script-rust]
package = "nishiki-build-script"
bin = "nishiki-build-script-rust"
text = 8162339
data = 2550644

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# `nishiki_unstable` turns on `nishiki::unstable`; any other cfg is a typo.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(nishiki_unstable)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"
# New in Rust 1.100 and warn by default: an unescaped `|` in a table row drops
# cells.
invalid_markdown_table = "deny"

[workspace.lints.cargo]
# Cargo's own lints, new in Rust 1.100. Clippy's -D warnings does not reach
# them, so each group is denied here; correctness is deny already.
# unused_dependencies (style) checks [dependencies] and [build-dependencies]
# from what the compiler used. cargo-machete in `deps` still covers
# [dev-dependencies].
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# `cargo package` writes `readme` into the manifest it packs, and the verify
# build reads that manifest, so the lint fails every published crate with a
# README.md on its own tarball.
manual_readme = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# An item from another module comes in through `use`, and the code names it
# by its last segment, or a function by its module: `fs::read`, never
# `std::fs::read` inline. The default limit is two segments.
# nishiki allows it for now: 1,168 paths break the rule, and rewriting them
# conflicts with the 30 pull requests open when the template brought it in
# (operator, 2026-11-14). The rewrite to `use` imports, and the return to
# "deny", follow once those pull requests land:
# https://github.com/victor-software-house/nishiki/issues/86
absolute_paths = "allow"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny fails on them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# nishiki keeps Cargo's default release profile, unlike the template's
# size-tuned one.
# Cargo ignores the profiles of a dependency, so consumers build nishiki at
# opt-level 3 with sixteen codegen units.
# The release examples that `mise run callgrind` counts must measure that
# build, the layout users get.
