[package]
name = "nishiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A syntax highlighting engine, written from scratch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
readme = "README.md"
keywords = ["syntax", "highlighting", "lexer", "textmate"]
categories = ["text-processing", "parser-implementations"]
# One integration test binary, tests/it/main.rs, rather than one per file.
autotests = false
# The published source holds only what builds and documents the crate.
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "THIRD-PARTY-NOTICES.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[features]
# Every language is on by default; `default-features = false` and one or more
# `lang-*` features, or a tier, build only what a caller highlights.
default = ["all"]
all = [
  "lang-rust",
  "lang-markdown",
  "lang-typescript",
  "lang-javascript",
  "lang-jsx",
  "lang-tsx",
  "lang-shell",
  "lang-json",
  "lang-python",
  "lang-yaml",
  "lang-toml",
  "lang-make",
  "lang-diff",
  "lang-dockerfile",
  "lang-java",
  "lang-c",
  "lang-sql",
  "lang-ini",
  "lang-graphql",
  "lang-css",
  "lang-kotlin",
]

# Tiers, which overlap.
config = [
  "lang-json",
  "lang-toml",
  "lang-yaml",
  "lang-ini",
  "lang-diff",
  "lang-dockerfile",
  "lang-make",
]
web = [
  "lang-typescript",
  "lang-javascript",
  "lang-jsx",
  "lang-tsx",
  "lang-css",
  "lang-json",
  "lang-graphql",
]
systems = ["lang-rust", "lang-c", "lang-shell", "lang-java", "lang-kotlin"]
docs = ["lang-markdown", "config"]

# One feature per lexer module. A language that embeds another needs it.
lang-rust = ["_space"]
lang-markdown = []
# One module lexes the four dialects, each a copy of the lexer.
lang-typescript = []
lang-javascript = []
lang-jsx = []
lang-tsx = []
lang-shell = []
lang-json = ["_classes", "_utf8"]
lang-python = ["_rule-engine"]
lang-yaml = ["_utf8", "_space"]
lang-toml = ["_classes", "_utf8"]
lang-make = ["_classes", "_utf8"]
lang-diff = ["_classes", "_utf8"]
lang-dockerfile = ["_classes", "_utf8"]
lang-java = ["_rule-engine", "_classes"]
lang-c = ["_classes", "_utf8"]
lang-sql = ["_classes", "_utf8"]
lang-ini = ["_classes", "_utf8"]
lang-graphql = ["lang-javascript", "_classes", "_utf8"]
lang-css = ["_rule-engine", "_classes"]
lang-kotlin = ["_rule-engine", "_classes"]

# Shared code that only some languages use; not for callers.
_classes = []
_rule-engine = ["_classes"]
_space = []
_utf8 = []

# Theme::from_json, for theme files in Shiki's JSON format. Not the JSON
# language, which is `lang-json`.
json = ["dep:serde_json"]

[dependencies]
memchr = "2.8.3"
serde_json = { version = "1.0.154", optional = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
# The tests name languages across the whole list, so they need all of it.
required-features = ["all"]

[dev-dependencies]
indoc = "2.0.8"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it, not a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# format! or push_str, not + on a String.
string_add = "deny"
# From and TryFrom, not as, which can silently truncate or wrap. A site that
# truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]>, not Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls the first the
# idiomatic path and mod.rs the older style, whose many same-named files blur
# together in an editor (ch07-05, "Alternate File Paths").
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"
