# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.6"

[settings]
# Every tool, whether a config file, a task or the command line asks for it,
# comes from the locks; one with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here instead of in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.99.1", profile = "minimal", components = "clippy", mr_boxington = true },
  # rustfmt's unstable options, rustdoc as docs.rs builds it, and Miri.
  { version = "nightly-2026-11-01", profile = "minimal", components = "rustfmt,miri,rust-src" },
]
mr-boxington = "1.29.1"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
jq = "1.8.2"

# The shared Rust tasks read their toolchains from here and name none.
[env]
# format runs rustfmt on the nightly, for its unstable options.
RUSTFMT_TOOLCHAIN = "+nightly-2026-11-01"
# doc builds on the nightly, as docs.rs does.
RUST_NIGHTLY = "nightly-2026-11-01"

# The one gate, composed from the pieces this repository keeps. deny:advisories
# and semver need the network, so they run as their own CI steps.
[tasks.verify]
description = "Every offline check this repository runs"
depends = [
  "check:toolchain",
  "format",
  "format:ts",
  "check:line-width",
  "lint",
  "check:features",
  "check:size",
  "test",
  "test:doc",
  "check:unstable",
  "codegen:lint",
  "codegen:check",
  "codegen:test",
  "test:miri",
  "doc",
  "check:docs",
  "deny",
  "deny:codegen",
  "deps",
  "check:versions",
  "check:repo",
  "test:scripts",
]

# Each compile of the whole crate takes about 2 GiB.
# verify ran four at once, which overran the 8 GiB CI runner.
# The shared catalog defines lint, test and test:doc.
# mise merges each table below into the catalog's task, so its run, env and
# timeout stay the catalog's.
#
# lint and test share target/, so cargo's lock already keeps their compiles
# apart.
# Each still compiled three copies at once: the library, its unit tests, and
# the library again as the build-script example's build dependency.
# Two jobs keep that to two.
[tasks.lint]
env = { CARGO_BUILD_JOBS = "2" }

[tasks.test]
env = { CARGO_BUILD_JOBS = "2" }

# A chain of tasks runs beside test, one after another: check:size, test:doc,
# check:unstable, codegen:lint and codegen:check.
# check:size waits for lint, in its own file, and each later task waits for
# the one before.
# test's integration binary, `it`, holds up to 3.3 GiB while it runs.
# With two jobs, a task of the chain compiled two copies of the crate beside
# it, which overran the 8 GiB CI runner.
# One job keeps a single compile beside it.
[tasks."test:doc"]
wait_for = ["check:size"]
env = { CARGO_BUILD_JOBS = "1" }

# nishiki::unstable compiles only with --cfg nishiki_unstable.
# This lints every target with the cfg and runs the module's doctests.
# The full suite runs once, in test, without the cfg.
# Its own target directory keeps the cfg's builds from replacing lint's.
# It waits for test:doc, so it compiles beside test only.
[tasks."check:unstable"]
description = "Lint with nishiki::unstable, and run its doctests"
wait_for = ["test:doc"]
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo test --locked --package nishiki --doc --all-features --no-fail-fast -- unstable",
]

[tasks."check:unstable".env]
CARGO_BUILD_JOBS = "1"
CARGO_TARGET_DIR = "target/unstable"
RUSTFLAGS = "--cfg nishiki_unstable"
RUSTDOCFLAGS = "--cfg nishiki_unstable"

# codegen/ writes the generated Rust files (mise-tasks/codegen.sh).
# Its builds compile nishiki once more, in target/codegen.
# They wait for check:unstable, so they compile beside test only.
[tasks."codegen:lint"]
description = "codegen/ is formatted and linted"
wait_for = ["check:unstable"]
run = [
  "cargo ${RUSTFMT_TOOLCHAIN:-} fmt --manifest-path codegen/Cargo.toml -- --check",
  "cargo clippy --locked --manifest-path codegen/Cargo.toml --all-targets -- -D warnings",
]

[tasks."codegen:lint".env]
CARGO_BUILD_JOBS = "1"
CARGO_TARGET_DIR = "target/codegen"
RUSTFLAGS = "--cfg nishiki_unstable"

[tasks."codegen:check"]
description = "Each generated Rust file is what codegen/ writes"
wait_for = ["codegen:lint"]
run = "mise run codegen -- --check"
env = { CARGO_BUILD_JOBS = "1" }

[tasks."codegen:test"]
description = "codegen/'s tests pass"
wait_for = ["codegen:check"]
run = "cargo test --locked --manifest-path codegen/Cargo.toml"

[tasks."codegen:test".env]
CARGO_BUILD_JOBS = "2"
CARGO_TARGET_DIR = "target/codegen"
RUSTFLAGS = "--cfg nishiki_unstable"

# cargo deny reads one workspace's graph, and codegen/ is its own.
[tasks."deny:codegen"]
description = "codegen/'s dependencies pass the deny rules"
run = "cargo deny --locked --manifest-path codegen/Cargo.toml check licenses bans sources"

# A version bump leaves every Cargo.lock that records nishiki stale.
# codegen/, bench/ and bench/compare/ are workspaces of their own, each with its
# own lock, and their tasks pass --locked.
# The Version PR runs this task after each bump (.ctl/ver.yaml).
[tasks."release:locks"]
description = "Every Cargo.lock records nishiki's current version"
run = [
  "cargo update --workspace",
  "cargo update --manifest-path codegen/Cargo.toml --package nishiki",
  "cargo update --manifest-path bench/Cargo.toml --package nishiki",
  "cargo update --manifest-path bench/compare/Cargo.toml --package nishiki",
]

# The tests of the Bun scripts under oracle/, bench/ and mise-tasks/.
# They need no network, unlike the oracle runs.
[tasks."test:scripts"]
description = "The tests of the Bun scripts"
tools = { bun = "1.4.4" }
run = "bun test ./oracle/ ./bench/ ./mise-tasks/"

# Bun's auto-install takes the whole npm tree of every script in this
# repository from bun.lock: the oracle, bench/compare and the research probes.
# This fails when package.json names a version the lockfile lacks.
[tasks."check:bun-lockfile"]
description = "bun.lock pins every package package.json names"
tools = { bun = "1.4.4" }
run = "bun install --lockfile-only --frozen-lockfile"

# The oracle reads every third-party file from a checkout of the
# nishiki-sources mirror, named by NISHIKI_SOURCES (oracle/AGENTS.md rule 9).
[tasks."check:sources"]
description = "NISHIKI_SOURCES holds every file the oracle pins, as the mirror's manifest says"
tools = { bun = "1.4.4" }
run = '''
bun run oracle/sources.ts check \
  "${NISHIKI_SOURCES:?set NISHIKI_SOURCES to a checkout of victor-software-house/nishiki-sources}"
'''

[tasks."sources:fill"]
description = "Fetch each file the oracle pins into the nishiki-sources checkout in NISHIKI_SOURCES"
tools = { bun = "1.4.4" }
run = '''
bun run oracle/sources.ts fill \
  "${NISHIKI_SOURCES:?set NISHIKI_SOURCES to a checkout of victor-software-house/nishiki-sources}"
'''

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # `mise run ver`, which the release workflow, check:versions, and semver
  # run. Bump the ref together with the verctl pin in mise.release.toml and
  # the workflow's pin.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=v0.7.1",
  # The shared Rust tasks, at actions main, 2026-11-11.
  "git::https://github.com/victor-software-house/actions.git//tasks/rust.toml?ref=bead5c01b61e14ecf1e923a5bcff97e8c421f151",
  # template:check, template:off, and template:on, at actions main, 2026-11-11.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=bead5c01b61e14ecf1e923a5bcff97e8c421f151",
]
