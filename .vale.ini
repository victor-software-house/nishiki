# Prose style, checked by `mise run lint:prose`.
# Vale finds this file from any directory below the root. The rules come
# from the ProseStyle package; `mise run prose:sync` fetches it into StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.14/ProseStyle.zip

# A tool writes target/**; nobody edits it by hand.
[target/**]
BasedOnStyles =

# A tool writes CHANGELOG.md; nobody edits it by hand.
[CHANGELOG.md]
BasedOnStyles =

# A tool writes tests/engine/*.rs; nobody edits it by hand.
[tests/engine/*.rs]
BasedOnStyles =

# A tool writes src/csharp/grammar.rs; nobody edits it by hand.
[src/csharp/grammar.rs]
BasedOnStyles =

# A tool writes src/blade/words.rs; nobody edits it by hand.
[src/blade/words.rs]
BasedOnStyles =

# A tool writes src/hack/words.rs; nobody edits it by hand.
[src/hack/words.rs]
BasedOnStyles =

# A tool writes src/php/words.rs; nobody edits it by hand.
[src/php/words.rs]
BasedOnStyles =

# A tool writes src/textmate/regex/folds.rs; nobody edits it by hand.
[src/textmate/regex/folds.rs]
BasedOnStyles =

# A tool writes src/textmate/regex/unicode.rs; nobody edits it by hand.
[src/textmate/regex/unicode.rs]
BasedOnStyles =

# Third-party text that nishiki measures or quotes as written: the benchmark
# corpus, the oracle's inputs and fixtures, and the licence texts.
[bench/corpus/**]
BasedOnStyles =

[oracle/inputs/**]
BasedOnStyles =

[tests/oracle/*/**]
BasedOnStyles =

[THIRD-PARTY-NOTICES.md]
BasedOnStyles =

# Frozen records: an archived change, recorded bench runs, and a research
# note fixed at the commits it names (openspec/AGENTS.md, research rule 3).
[openspec/changes/archive/**]
BasedOnStyles =

[bench/results/**]
BasedOnStyles =

[bench/compare/results/**]
BasedOnStyles =

[openspec/research/**]
BasedOnStyles =

# OpenSpec's change parser requires the headings `## Why` and `## What Changes`
# in a proposal, and ChattyHeadings flags both. Only those two lines are
# ignored, and only in proposal.md files, the archive's included.
[openspec/changes/**/proposal.md]
BlockIgnores = (?m)^## (?:Why|What Changes)$
