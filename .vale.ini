# Prose style, checked by `mise run lint:prose`.
# Vale finds this file from any directory below the root. The rules come
# from the ProseStyle package; `mise run prose:sync` fetches it into StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.6/ProseStyle.zip

# A tool writes target/**; nobody edits it by hand.
[target/**]
BasedOnStyles =

# A tool writes CHANGELOG.md; nobody edits it by hand.
[CHANGELOG.md]
BasedOnStyles =

# A tool writes tests/engine/*.rs; nobody edits it by hand.
[tests/engine/*.rs]
BasedOnStyles =

# A tool writes src/{csharp/grammar,blade/words,hack/words,php/words,textmate/regex/folds,textmate/regex/unicode}.rs; nobody edits it by hand.
[src/{csharp/grammar,blade/words,hack/words,php/words,textmate/regex/folds,textmate/regex/unicode}.rs]
BasedOnStyles =

# Third-party text that nishiki measures or quotes as written: the benchmark
# corpus, the oracle's inputs and fixtures, and the licence texts.
[bench/corpus/**]
BasedOnStyles =

[oracle/inputs/**]
BasedOnStyles =

[tests/oracle/*/**]
BasedOnStyles =

[THIRD-PARTY-NOTICES.md]
BasedOnStyles =

# Frozen records: an archived change, recorded bench runs, and a research
# note fixed at the commits it names (openspec/AGENTS.md, research rule 3).
[openspec/changes/archive/**]
BasedOnStyles =

[bench/results/**]
BasedOnStyles =

[bench/compare/results/**]
BasedOnStyles =

[openspec/research/**]
BasedOnStyles =
