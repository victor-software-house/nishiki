[package]
name = "nishiki-codegen"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
description = "Writes nishiki's generated Rust files from its grammars"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
# A tool that a person or CI runs; never published (CODING_STANDARDS 5.3).
publish = false

# Its own workspace, outside the root's (openspec rust-codegen, design section 3).
# As a member, its features would unify into every root build, check:size included.
[workspace]

[dependencies]
# nishiki::unstable needs `textmate` and one language on the rule engine.
nishiki = { path = "..", default-features = false, features = [
  "textmate",
  "lang-c",
] }
# The matcher writer builds tokens with quote and lays them out with
# prettyplease, at the versions the root crate pins.
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
prettyplease = { version = "0.3.0", default-features = false }
syn = { version = "3.0.10", default-features = false, features = [
  "full",
  "parsing",
] }
# The facts files of oracle/facts/ read as `serde_json::Value`, with no derive
# (operator, 2026-11-11). nishiki's `textmate` already builds serde_json, so
# the lock gains no crate.
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(nishiki_unstable)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
panic_in_result_fn = "deny"
map_err_ignore = "deny"
string_add = "deny"
as_conversions = "deny"
mod_module_files = "deny"
