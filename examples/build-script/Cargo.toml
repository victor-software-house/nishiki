[package]
name = "nishiki-build-script"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
description = "Compiles TextMate grammars in its build script and highlights with them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
# Never published (CODING_STANDARDS 5.3).
publish = false
autotests = false
autoexamples = false
autobenches = false
autobins = false
build = "build.rs"

[[bin]]
name = "nishiki-build-script"
path = "main.rs"

[[bin]]
name = "nishiki-build-script-rust"
path = "rust.rs"

# The build script compiles the grammars, and the programs load the bytes or
# include the Rust. Both need nishiki's TextMate engine. Each asks for the
# default features too, as the other members do: the engine alone leaves the
# hand lexers' shared code unused.
# Only the build script writes Rust, so only its nishiki takes `format`.
# Cargo does not unify a build dependency's features with a normal one's, so
# the programs build nishiki without `codegen` and `format`.
# `cargo package` keeps build and normal dependencies, and each needs a
# version. The workspace entry is a path alone, so these two name the version
# beside the path. `cargo package --workspace` packages nishiki first and
# resolves this requirement to that package.
[build-dependencies]
nishiki = { path = "../..", version = "0.1", default-features = false, features = [
  "default",
  "format",
] }

[dependencies]
nishiki = { path = "../..", version = "0.1", default-features = false, features = [
  "default",
  "textmate",
] }

[dev-dependencies]
indoc = { workspace = true }

[lints]
workspace = true
