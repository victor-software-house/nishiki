[package]
name = "nishiki-build-script"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "Compiles a TextMate grammar in its build script and highlights with it"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
# Never published (CODING_STANDARDS 5.3).
publish = false
autotests = false
autoexamples = false
autobenches = false
autobins = false
build = "build.rs"

[[bin]]
name = "nishiki-build-script"
path = "main.rs"

# The build script compiles the grammar, and the program loads the bytes.
# Both need nishiki's TextMate engine. Each asks for the default features too,
# as the other members do: the engine alone leaves the hand lexers' shared code
# unused.
# `cargo package` keeps build and normal dependencies, and each needs a
# version. The workspace entry is a path alone, so these two name the version
# beside the path. `cargo package --workspace` packages nishiki first and
# resolves this requirement to that package.
[build-dependencies]
nishiki = { path = "../..", version = "0.1", default-features = false, features = [
  "default",
  "textmate",
] }

[dependencies]
nishiki = { path = "../..", version = "0.1", default-features = false, features = [
  "default",
  "textmate",
] }

[dev-dependencies]
indoc = { workspace = true }

[lints]
workspace = true
