# TOML formatting, checked by `mise run format:toml`.
# The Copier template owns the layout of the files it renders.
exclude = [
  "target/**",
  # Benchmark inputs keep their sources' bytes (bench/corpus/README.md).
  "bench/corpus/**",
  # Oracle inputs are test data, some of them invalid on purpose.
  "oracle/inputs/*.toml",
  ".miserc.toml",
  "committed.toml",
  "mise.dev.toml",
  "mise.ci.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "clippy.toml",
  "deny.toml",
]
