# The benchmark corpus (bench/AGENTS.md; openspec bench-methodology,
# design decision 2). Each file under bench/corpus/ has one row here, and
# `mise run check:corpus` fails when a file and its row disagree.
#
# - tier: small (1 to 4 KiB), medium (16 to 64 KiB), large (200 KiB to
#   1 MiB, for the languages the comparison covers), or reply (a Markdown
#   reply with code blocks in several languages).
# - origin: neutral (no measured engine was tuned on it), oracle (nishiki's
#   oracle uses it too), or shared (another engine's benchmark uses it).
# - source is the file at a pinned commit; licence is read at
#   licence_source, the repository's licence or the file's own header.
#
# Changing a file, or adding or removing one, raises version: figures from
# two versions are never compared.
# It also changes digest, the SHA-256 of each file's path and SHA-256, sorted
# by path; `mise run check:corpus` prints the new value.
# Two pull requests that raise version to the same number write different
# digests, so their merge conflicts here instead of passing silently.
version = 15
digest = "4c6f8622668e32d2fb174d18dcb16f2645cfc96d5f3eaf13e311d869c99b435a"

