[package]
name = "nishiki-compare"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
description = "Compares nishiki with other highlighters on the benchmark corpus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-software-house/nishiki"
# Measurement only; never published or distributed (bench/compare/README.md).
publish = false

# Its own workspace, apart from the crate's and the core benches'
# (openspec bench-methodology, design decision 3).
# The comparators' dependencies never enter either lock.
# Some of those dependencies build C.
[workspace]

[features]
# giallo is EUPL-1.2, a copyleft licence.
# It is built only on the bench box and never distributed.
# It is off by default (operator, 2026-11-03; design decision 13).
giallo = ["dep:giallo"]

[dependencies]
nishiki = { path = "../..", features = ["textmate", "json"] }
nishiki-bench = { path = ".." }
serde_json = "1.0.154"
# syntect's default regex backend, Oniguruma, is the one bat uses.
syntect = "5.3.0"
two-face = "0.5.2"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
giallo = { version = "0.5.2", optional = true, features = ["dump"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"
