# What every recorded benchmark result is judged against (bench/AGENTS.md).
# A target changes only by a dated decision, cited in the comment above it.
#
# Not set yet, with the reason:
# - First-contact and first-line floors: their rounds spread by about 30%.
#   They get a floor once a record shows them stable.

# A result regresses when its statistic is worse than the last recorded
# result on the same host class by more than this percentage and by at least
# its unit's floor, so noise in small numbers does not fire.
tolerance_pct = 10

[floors]
mib_per_s = 1.0
us = 0.5

# A streamed line must never cost a frame.
# The frame budget is 4 ms, as in the 2026-10-22 engine comparison.
# The two targets below apply it to the latency program's figures
# (openspec bench-methodology, design decision 6; lead, 2026-11-04).
# They hold for every language and tier of the corpus.

# A line's steady cost: each line's median over passes 2 to 11, then the
# p99 over the document's lines.
# The first record meets it on every language and tier.
[[target]]
metric = "steady_p99"
stat = "median"
op = "<="
value = 4000
unit = "us"
reason = "one streamed line fits a 4 ms frame"

# The worst line of the first pass, while lazy structures are still built.
# The first record misses it on bat, cmake, haskell and powershell at the
# medium tier, and on c at the large tier.
[[target]]
metric = "first_contact_max"
stat = "median"
op = "<="
value = 4000
unit = "us"
reason = "even the first line a highlighter meets fits a frame"

# Reported, not bound.
# Each is compared with the last recorded result on the same host class,
# under the regression rule above.
[reported.throughput]
metric = "throughput"
stat = "median"
unit = "mib_per_s"

[reported.first_line]
metric = "first_line_time"
stat = "median"
unit = "us"

[reported.styling]
metric = "theme_style_time"
stat = "median"
unit = "ns_per_token"

# Throughput floors in MiB/s, on each language's medium file (lead, 2026-11-04).
# A floor is the language's lowest round in the first record, less 11%.
# The 11% is the reference class's noise bound.
# Floors are rounded down to 0.1 MiB/s.
# Source: tag bench/0a58343ad39d593b1565956ed1f7792023043a29, results/namespace-8x16/.
# That record predates the speed work of 2026-11-04.
