# Spelling, checked by `mise run lint:typos`.
[files]
# src/html/words.rs and src/html_words.rs are generated from the html
# grammar's word lists, whose attribute, entity and event names (`ofr`,
# `pluse`, `seeked`) are not English, and
# src/less/words.rs spells out `[ensw]{1,4}-resize`, as `nees-resize`.
# src/php/words.rs, src/hack/words.rs and src/blade/words.rs hold their
# grammars' constant names, such as `EXITT`, and src/php/scope.rs and
# src/blade/scope.rs their scope names, which spell `repitition`.
# src/asm/scope.rs and src/asm/words.rs are generated from the asm grammar,
# whose scope names spell `supplimental`.
# src/shaderlab/words.rs spells out ColorMask's `[ABGR]{1,3}`, such as `ba`.
# Each src/<language>/grammar.rs listed here is generated from that
# language's grammar and keeps the grammar's own words.
# tests/engine/grammars/ holds Shiki's grammars as Shiki ships them.
# oracle/facts/ holds code points in hex, such as `AADB..AADD`.
extend-exclude = [
  "*.lock",
  "src/asm/grammar.rs",
  "src/asm/scope.rs",
  "src/asm/words.rs",
  "src/bat/grammar.rs",
  "src/blade/grammar.rs",
  "src/blade/scope.rs",
  "src/blade/words.rs",
  "src/coffee/grammar.rs",
  "src/common_lisp/grammar.rs",
  "src/hack/words.rs",
  "src/haml/grammar.rs",
  "src/html/words.rs",
  "src/html_words.rs",
  "src/julia/grammar.rs",
  "src/latex/grammar.rs",
  "src/less/words.rs",
  "src/matlab/grammar.rs",
  "src/mermaid/grammar.rs",
  "src/objective_c/grammar.rs",
  "src/objective_cpp/grammar.rs",
  "src/php/grammar.rs",
  "src/php/scope.rs",
  "src/php/words.rs",
  "src/shaderlab/words.rs",
  "src/svelte/grammar.rs",
  "tests/engine/grammars/*.json",
  "oracle/facts/*.json",
]

# Unicode general-category codes, such as Nd, which are not words.
[default.extend-words]
nd = "nd"
# amsmath's `multline` environment, which the latex grammar names.
multline = "multline"
# SQL Server's `iif` function, which the sql grammar names.
iif = "iif"
# The shellscript grammar names a rule `normal_statement_seperator`, and
# oracle/coverage-waivers.ts quotes that path.
seperator = "seperator"
# The php grammar's `p(?:ublic|rivate|rotected)`, which the PHP matchers'
# doc comments quote.
ublic = "ublic"
# The MATLAB probe snippets spell near misses of `NaN`, such as `Nax`, to
# probe the command-name expression.
nax = "nax"
# The asm grammar's `fpr0` to `fpr7` registers, which
# oracle/inputs/asm-coverage.asm lists.
fpr = "fpr"
# The asm grammar's `globa?l`, which the Assembly matchers' doc comments
# quote.
globa = "globa"
# The haml grammar's `(?:requir|includ)e_once`, which the HAML matchers'
# doc comments quote.
includ = "includ"
requir = "requir"
# HLSL's level-of-detail state keys, such as `MaxLOD`, which the hlsl grammar
# lists and oracle/inputs/hlsl-coverage.hlsl uses.
lod = "lod"
