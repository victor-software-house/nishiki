[package]
name = "textmate-proto"
version = "0.0.0"
edition = "2024"
publish = false
description = "A research prototype of nishiki's TextMate engine; the nishiki crate takes none of its code."

# Its own workspace, so the root crate's lints, deny rules and versions never read it.
[workspace]

[dependencies]
serde_json = "1"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "survey-regex"
path = "src/bin/survey_regex.rs"

[profile.release]
debug = false

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "rx"
path = "src/bin/rx.rs"
